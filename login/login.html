<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotec - Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">

    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>

<body>
    <header class="header">
        <a href="../Home/home.html">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do sistema Bibliotec">
        </a>

        <nav class="navigation">
            <a href="../Home/home.html">Home</a>
        </nav>
    </header>

    <!-- LOGIN -->
    <main class="content">
        <section class="login">
            <div class="login-header">
                <img src="../imgs/Icone - Bibliotec.png" alt="Logo Bibliotec">

                <h1>Bem vindo(a) à Bibliotec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>

            <form>
                <div class="camp">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com">
                </div>

                <div class="camp">
                    <label for="senha">Senha</label>
                    <div class="password-camp">
                        <input required type="password" id="senha" placeholder="***************">
                        <button id="show-password" class="eye-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>

                </div>

                <button class="join-button">Entrar</button>
                <button class="join-google">
                    <img src="../imgs/icone-google.svg" alt="Logo Google">
                    <span>Continuar com google</span>
                </button>
            </form>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
